# Front-door routing for irani-ip.ir -> iranip-nginx-1 container.
# Cloudflare (Flexible SSL) connects to this server over HTTP and reports the
# visitor-facing protocol via X-Forwarded-Proto. Preserve that header so
# WordPress knows the request was HTTPS; otherwise /wp-admin/ redirect-loops.
map $http_x_forwarded_proto $iranip_forwarded_proto {
    default $http_x_forwarded_proto;   # honour Cloudflare's value (https)
    ''      $scheme;                    # fallback for direct/origin requests
}

server {
    listen 80;
    server_name irani-ip.ir;
    resolver 127.0.0.11 valid=10s;
    location / {
        set $upstream iranip-nginx-1;
        proxy_pass http://$upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $iranip_forwarded_proto;
    }
}
