x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - storage_data:/var/www/html/storage
  env_file:
    - .env
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - vendora-frontend
      - iranip_net          # reach iranip-nginx-1 to serve irani-ip.ir
    restart: unless-stopped

  api:
    <<: *api-common
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - vendora-backend
      - vendora-frontend
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    environment:
      NODE_ENV: production
      SERVER_API_URL: http://nginx:8080
    command: ["node", "server.js"]
    networks:
      - vendora-frontend
    restart: unless-stopped
    healthcheck:
      disable: true

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: >
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vendora-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - vendora-backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - vendora-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    <<: *api-common
    command: php artisan queue:work --queue=default,emails,notifications --sleep=3 --tries=3 --timeout=90
    networks:
      - vendora-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    <<: *api-common
    command: php artisan schedule:work
    networks:
      - vendora-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  vendora-backend:
    driver: bridge
  vendora-frontend:
    driver: bridge
  # Owned by the iranip stack (name: iranip_net). Declared external so this
  # front-door nginx can resolve iranip-nginx-1 by name. The iranip stack must
  # be up before recreating this nginx.
  iranip_net:
    external: true

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  storage_data:
