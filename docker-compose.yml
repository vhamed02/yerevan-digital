x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - storage_data:/var/www/html/storage
  env_file:
    - .env

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/api:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - api
      - web
    networks:
      - vendora-frontend
    restart: unless-stopped

  api:
    <<: *api-common
    networks:
      - vendora-backend
      - vendora-frontend
    depends_on:
      - mysql
      - mongodb
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    env_file:
      - .env
    networks:
      - vendora-frontend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-vendora}
      MYSQL_USER: ${DB_USERNAME:-vendora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vendora-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-vendora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-vendora_docs}
    volumes:
      - mongodb_data:/data/db
    networks:
      - vendora-backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - vendora-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    <<: *api-common
    command: php artisan queue:work --queue=default,emails,notifications
    networks:
      - vendora-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *api-common
    command: php artisan schedule:work
    networks:
      - vendora-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  vendora-backend:
    driver: bridge
  vendora-frontend:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  storage_data:
