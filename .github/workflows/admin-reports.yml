name: admin-reports

on:
  push:
    paths:
      - 'services/admin-reports/**'
      - '.github/workflows/admin-reports.yml'
  pull_request:
    paths:
      - 'services/admin-reports/**'
      - '.github/workflows/admin-reports.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/admin-reports/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
